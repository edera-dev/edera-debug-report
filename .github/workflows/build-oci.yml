name: build-oci-image

on:
  push:
    branches: ["main"]
    tags: ["*", "v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-oci-image:
    runs-on: edera-large
    strategy:
      fail-fast: false
      matrix:
        component:
          - edera-debug-report-oci
    name: build ${{ matrix.component }} container image
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        id: push-step
        with:
          platforms: linux/amd64
          target: ${{ matrix.component }}
          tags: ghcr.io/edera-dev/${{ matrix.component }}:latest
          push: true
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push-step.outputs.digest }}
          TAGS: ghcr.io/edera-dev/${{ matrix.component }}:latest
          COSIGN_EXPERIMENTAL: "true"
        run: cosign sign --yes "${TAGS}@${DIGEST}"

      - name: Build `builder` stage for static-lib versions
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          target: builder
          platforms: linux/amd64
          load: true
          tags: sbom-builder:latest
      - name: Generate and attest CycloneDX SBOM
        env:
          DIGEST: ${{ steps.push-step.outputs.digest }}
          TAGS: ghcr.io/edera-dev/${{ matrix.component }}:latest
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail

          # submodule commits/version
          DMIDECODE_COMMIT="$(git -C extern/dmidecode rev-parse HEAD)"
          DMIDECODE_VERSION="$(git -C extern/dmidecode describe --tags --always)"
          PCIUTILS_COMMIT="$(git -C extern/pciutils rev-parse HEAD)"
          PCIUTILS_VERSION="$(git -C extern/pciutils describe --tags --always)"
          REPO_COMMIT="$(git rev-parse HEAD)"
          REPO_VERSION="$(git describe --tags --always)"
          export DMIDECODE_COMMIT DMIDECODE_VERSION PCIUTILS_COMMIT PCIUTILS_VERSION \
                 REPO_COMMIT REPO_VERSION

          GLIBC_VERSION="$(docker run --rm sbom-builder:latest rpm -q --qf '%{VERSION}-%{RELEASE}' glibc-static)"
          ZLIB_VERSION="$(docker run --rm sbom-builder:latest rpm -q --qf '%{VERSION}-%{RELEASE}' zlib-static)"
          export GLIBC_VERSION ZLIB_VERSION

          python3 generate-sbom.py

          jq -e '.bomFormat == "CycloneDX" and ((.components // []) | length > 0)' \
            "${COMPONENT}.cdx.json" >/dev/null \
            || { echo "::error::SBOM for ${COMPONENT} is empty or invalid"; exit 1; }
          jq '{component: env.COMPONENT, components: (.components | length)}' \
            "${COMPONENT}.cdx.json"

          cosign attest --yes --type cyclonedx \
            --predicate "${COMPONENT}.cdx.json" \
            "${TAGS}@${DIGEST}"
